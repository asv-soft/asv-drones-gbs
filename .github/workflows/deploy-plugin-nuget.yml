name: Deploy GBS Plugin NuGet

on:
  push:
    tags:
      - "plugin-v[0-9]+.[0-9]+.[0-9]+"
      - "plugin-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "plugin-v[0-9]+.[0-9]+.[0-9]+-rc"

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  GITHUB_PACKAGES_URL: "https://nuget.pkg.github.com/asv-soft/index.json"
  NUGET_SOURCE_URL: "https://api.nuget.org/v3/index.json"
  CONTRACTS_PROJECT_PATH: "./src/Asv.Drones.Gbs.Contracts/Asv.Drones.Gbs.Contracts.csproj"
  PLUGIN_PROJECT_PATH: "./src/Asv.Drones.Plugin.Gbs/Asv.Drones.Plugin.Gbs.csproj"
  PROPS_VERSION_VAR_NAME: "ProductVersion"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.x.x

      - name: Add GitHub Packages source
        run: dotnet nuget add source ${{ env.GITHUB_PACKAGES_URL }} --username '${{ secrets.USER_NAME }}' --password '${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}' --store-password-in-clear-text

      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#plugin-v}" >> "$GITHUB_ENV"

      - name: Read version from Directory.Build.props
        run: |
          version=$(grep -oP '<${{ env.PROPS_VERSION_VAR_NAME }}>\K[^<]+' ./src/Directory.Build.props)
          echo "PROPS_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Validate package version
        run: |
          if [ "${{ env.PROPS_VERSION }}" != "${{ env.VERSION }}" ]; then
            echo "Error: tag version does not match ${{ env.PROPS_VERSION_VAR_NAME }}"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore ${{ env.PLUGIN_PROJECT_PATH }}

      - name: Build plugin and dependencies
        run: dotnet build ${{ env.PLUGIN_PROJECT_PATH }} --configuration Release --no-restore

      - name: Pack plugin and dependencies
        run: |
          dotnet pack ${{ env.CONTRACTS_PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} /p:Version="${{ env.VERSION }}"
          dotnet pack ${{ env.PLUGIN_PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} /p:Version="${{ env.VERSION }}"

      - name: Push packages to GitHub Packages
        run: dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg" --api-key '${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}' --skip-duplicate --source ${{ env.GITHUB_PACKAGES_URL }}

      - name: Push packages to NuGet.org
        run: dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg" -k ${{ secrets.NUGET_AUTH_TOKEN }} --skip-duplicate -s ${{ env.NUGET_SOURCE_URL }}
